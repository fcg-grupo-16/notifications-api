name: CI

# ⚠️ REPOSITÓRIO DEPRECADO (Fase 3) — ver DEPRECATED.md.
#
# Sem deploy, não há razão para gastar runner a cada PUSH — esse gatilho saiu. O workflow NÃO foi
# removido: um repo arquivado com CI deletado dá a impressão de que o código nunca foi testado.
#
# `pull_request` FICA, e não por descuido. `build-and-test` é check OBRIGATÓRIO na proteção da main
# deste repo (com enforce_admins ligado): sem ele reportando, nenhum PR consegue ser mergeado — nem
# este. E o custo é zero, porque repositório arquivado não aceita PR.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build
